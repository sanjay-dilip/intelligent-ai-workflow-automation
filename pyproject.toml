[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-ai"
version = "0.1.0"
description = "Predictive ML and rules-based operational intelligence system for business workflow monitoring."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.1,<3.0",
    "numpy>=1.26,<2.0",
    "scikit-learn>=1.4,<2.0",
    "joblib>=1.3,<2.0",
    "streamlit>=1.32,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "black>=24.0,<25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
